[package]
name = "ndx-terminal"
version = "0.1.0"
description = "NDX Terminal desktop shell"
edition = "2021"
rust-version = "1.80"

[lib]
name = "ndx_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
